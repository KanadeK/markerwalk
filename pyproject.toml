[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "markerwalk"
version = "0.1.0"
description = "Offline photo-coverage QA and revisit routing for cemetery survey volunteers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "KanadeK" }]
keywords = ["cemetery", "field-survey", "genealogy", "offline", "photography"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.13.2",
]

[project.scripts]
markerwalk = "markerwalk.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/markerwalk"
Issues = "https://github.com/KanadeK/markerwalk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/markerwalk"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=markerwalk --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["markerwalk"]
